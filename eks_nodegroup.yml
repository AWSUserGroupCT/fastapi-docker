apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: hilarious-dubstep-otter
  region: us-east-1  # TODO: confirm region

# Private subnets of evans-vpc-vpc (one per AZ).
vpc:
  id: vpc-088b9fed18ac38c3d
  securityGroup: sg-0d8ed28808b5f9971
  subnets:
    private:
      us-east-1a: { id: subnet-0ee812863d625602d }
      us-east-1b: { id: subnet-00610e447e26449e1 }

managedNodeGroups:
  - name: demo-eh-private-ng
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 50
    volumeType: gp3
    privateNetworking: true   # nodes only in the private subnets, no public IPs
    subnets:
      - subnet-0ee812863d625602d
      - subnet-00610e447e26449e1
    iam:
      withAddonPolicies:
        ebs: true             # gp3 StorageClass (ebs.csi.aws.com)
        efs: true             # efs-sc StorageClass (efs.csi.aws.com)
    labels:
      role: workers
