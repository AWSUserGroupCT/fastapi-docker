# Dynamically provisioned via the efs-sc StorageClass (EFS access point owned by uid/gid 999).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hello-human.fullname" . }}-efs-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.efs_pvc.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.efs_pvc.size }}
