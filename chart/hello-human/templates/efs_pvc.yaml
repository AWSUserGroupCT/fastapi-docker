apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "hello-human.fullname" . }}-efs-pv
spec:
  capacity:
    storage: {{ .Values.efs_pvc.size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.efs_pvc.storageClassName }}
  csi:
    driver: efs.csi.aws.com
    # <file-system-id>:<path on the EFS>. The path must already exist on the EFS.
    volumeHandle: {{ .Values.efs_pvc.fileSystemId }}:{{ .Values.efs_pvc.path }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hello-human.fullname" . }}-efs-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.efs_pvc.storageClassName }}
  volumeName: {{ include "hello-human.fullname" . }}-efs-pv
  resources:
    requests:
      storage: {{ .Values.efs_pvc.size }}
