replicaCount: 3

image:
  repository: docker.io/dmevanct/fastapi-docker
  tag: v0.4
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Contour in this cluster has no IngressClass configured, so it serves
  # Ingresses with no class. Set to "contour" if you add an IngressClass.
  className: ""
  annotations: {}
  # Leave host empty to match any hostname (e.g. http://localhost:9090).
  host: ""
  path: /api/workers
  pathType: Prefix
  tls: []
  #  - secretName: hello-human-tls
  #    hosts:
  #      - hello.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: "40Gi"
  limits:
    memory: 256Mi

volumeMounts:
  - name: mounted-efs
    mountPath: /mnt/data

volumes:
  - name: mounted-efs
    persistentVolumeClaim:
      claimName: hello-human-efs-pvc

podSecurityContext:
  runAsNonRoot: true
  # Dockerfile creates user "app" by name; kubelet needs a numeric UID to verify non-root.
  runAsUser: 999
  runAsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]



efs_pvc:
  storageClassName: efs-sc
  fileSystemId: fs-08769f28876908ff7
  path: /data/fastapi
  size: 100Gi
