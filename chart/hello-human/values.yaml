replicaCount: 3

image:
  repository: docker.io/dmevanct/fastapi-docker
  tag: v0.4x86
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Leave host empty ("") to match any hostname.
  host: app.pres.labspres.com
  # Served by the AWS Load Balancer Controller. Every Ingress with the same
  # group.name shares one ALB; give each API a unique path and group.order.
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: shared-api
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:877969058937:certificate/619056d9-9897-4988-8bbe-b3e111dbb006
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=platform,Project=hello-human
  path: /api/workers
  pathType: Prefix
  tls: []
  #  - secretName: hello-human-tls
  #    hosts:
  #      - hello.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: "40Gi"
  limits:
    memory: 256Mi

volumeMounts:
  - name: mounted-efs
    mountPath: /mnt/data

volumes:
  - name: mounted-efs
    persistentVolumeClaim:
      claimName: hello-human-efs-pvc

podSecurityContext:
  runAsNonRoot: false
  # Dockerfile creates user "app" by name; kubelet needs a numeric UID to verify non-root.
  runAsUser: 999
  runAsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]



efs_pvc:
  storageClassName: efs-sc
  fileSystemId: fs-08769f28876908ff7
  path: /
  size: 100Gi
