# Single eksctl config for the existing cluster.
#   eksctl utils associate-iam-oidc-provider -f eks_config.yml --approve   (or let create addon do it)
#   eksctl create addon -f eks_config.yml          # aws-efs-csi-driver + aws-ebs-csi-driver + IAM roles
#   eksctl create nodegroup -f eks_config.yml      # private managed node group
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: hilarious-dubstep-otter
  region: us-east-1  # TODO: confirm region

vpc:
  id: vpc-088b9fed18ac38c3d
  securityGroup: sg-REPLACE_ME       # TODO: cluster security group
  subnets:
    private:
      us-east-1a: { id: subnet-0ee812863d625602d }
      us-east-1b: { id: subnet-00610e447e26449e1 }

iam:
  withOIDC: true                     # required for the addon's IAM role (IRSA)

addons:
  - name: aws-efs-csi-driver
    wellKnownPolicies:
      efsCSIController: true         # creates the IRSA role for efs-csi-controller-sa
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true         # creates the IRSA role for ebs-csi-controller-sa

managedNodeGroups:
  - name: hello-human-private-ng
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 50
    volumeType: gp3
    privateNetworking: true          # private subnets only, no public IPs
    subnets:
      - subnet-0ee812863d625602d
      - subnet-00610e447e26449e1
    iam:
      withAddonPolicies:
        ebs: true                    # gp3 StorageClass (ebs.csi.aws.com)
        efs: true                    # efs-sc StorageClass (efs.csi.aws.com)
    labels:
      role: workers
